name: Mantener backend despierto

# Render en el plan gratuito duerme el servicio tras ~15 min sin tráfico
# entrante (el próximo pedido tardaría 30-50s en responder mientras arranca de
# nuevo). Mientras no se pague un plan con el owner, esto le manda una
# petición a /ping cada 10 min para que nunca llegue a dormirse.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /ping
        run: curl -sf --max-time 60 https://urbanperu-backend.onrender.com/ping
